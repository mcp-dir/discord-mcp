# Smithery configuration for Discord
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_discord

name: discord-mcp
displayName: "Discord"
description: >
  Conecte um bot Discord (token de bot do developer portal) para ler/enviar mensagens, listar servidores e canais, reagir, mandar DMs e gerenciar mensagens via a API REST oficial (discord.com/api/v10). Guild ID opcional define o servidor padrão usado por tools como list_channels e list_guild_members.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/discord-mcp
repository: https://github.com/mcp-dir/discord-mcp

tags:
  - discord
  - brazil
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_discord

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_discord/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
